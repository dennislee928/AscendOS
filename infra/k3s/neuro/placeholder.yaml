apiVersion: v1
kind: Namespace
metadata:
  name: ascendos-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuro
  namespace: ascendos-ai
  labels:
    app: neuro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neuro
  template:
    metadata:
      labels:
        app: neuro
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: neuro
          image: ghcr.io/your-org/ascendos-neuro:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7860
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: neuro
  namespace: ascendos-ai
spec:
  selector:
    app: neuro
  ports:
    - name: http
      port: 80
      targetPort: 7860
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: neuro
  namespace: ascendos-ai
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`neuro.example.com`)
      services:
        - name: neuro
          port: 80
  tls:
    secretName: placeholder-tls
