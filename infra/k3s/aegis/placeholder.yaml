apiVersion: v1
kind: Namespace
metadata:
  name: ascendos-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis
  namespace: ascendos-ai
  labels:
    app: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis
  template:
    metadata:
      labels:
        app: aegis
    spec:
      containers:
        - name: aegis
          image: ghcr.io/your-org/ascendos-aegis:placeholder
          ports:
            - containerPort: 8080
          env:
            - name: RUST_LOG
              value: info
---
apiVersion: v1
kind: Service
metadata:
  name: aegis
  namespace: ascendos-ai
spec:
  selector:
    app: aegis
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aegis
  namespace: ascendos-ai
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`aegis.example.com`)
      services:
        - name: aegis
          port: 80
  tls:
    secretName: placeholder-tls
