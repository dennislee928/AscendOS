openapi: 3.0.3
info:
  title: Core Gateway API
  version: 0.1.0
  description: OpenAPI-first scaffold for Phase 1 gateway/auth.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /readyz:
    get:
      operationId: readyz
      summary: Readiness check
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics placeholder
      responses:
        '200':
          description: Placeholder metrics response
          content:
            text/plain:
              schema:
                type: string
  /me:
    get:
      operationId: me
      summary: Return claims from bearer token (stub)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Claims extracted
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid bearer token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
