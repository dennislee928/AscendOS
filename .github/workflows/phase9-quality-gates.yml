name: phase9-quality-gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase9-quality-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  QUALITY_GATES_STRICT: "0"
  QUALITY_GATES_COVERAGE_THRESHOLD: "80"

jobs:
  unit-coverage:
    name: unit-coverage (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - go
          - python
          - rust
          - node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Coverage gate
        run: |
          chmod +x scripts/ci/coverage-gate-placeholder.sh
          scripts/ci/coverage-gate-placeholder.sh "${{ matrix.language }}"

  contract-schemathesis:
    name: contract-schemathesis
    runs-on: ubuntu-latest
    needs: unit-coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Schemathesis contract gate
        env:
          OPENAPI_SPEC_PATH: services/core-gateway/api/openapi.yaml
          SCHEMATHESIS_BASE_URL: ${{ vars.SCHEMATHESIS_BASE_URL }}
        run: |
          chmod +x scripts/ci/run-schemathesis-placeholder.sh
          scripts/ci/run-schemathesis-placeholder.sh --ci

  deployment-metadata:
    name: deployment-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate HF Space deployment metadata
        run: python3 scripts/ci/validate-hf-space-contracts.py

  e2e-playwright-nightly:
    name: e2e-playwright-nightly
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: contract-schemathesis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: E2E smoke gate
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: |
          chmod +x scripts/ci/run-e2e-placeholder.sh
          scripts/ci/run-e2e-placeholder.sh --ci

  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Phase 9 docs are present
        run: |
          test -f docs/api/contract-testing-schemathesis.md
          test -f docs/qa/docs-pipeline-notes.md
          test -f docs/qa/launch-checklist-phase9.md
          echo "Phase 9 docs scaffold present."

  launch-readiness:
    name: launch-readiness
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - unit-coverage
      - contract-schemathesis
      - deployment-metadata
      - docs-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Launch checklist gate
        run: |
          if grep -n '^- \[ \]' docs/qa/launch-checklist-phase9.md; then
            echo "Launch checklist still has incomplete items."
            echo "Complete every checkbox in docs/qa/launch-checklist-phase9.md before launch readiness can pass."
            exit 1
          fi
          if grep -n 'TODO(owner):' docs/qa/launch-checklist-phase9.md; then
            echo "Launch checklist still contains owner placeholders."
            echo "Replace every TODO(owner): marker in docs/qa/launch-checklist-phase9.md before launch readiness can pass."
            exit 1
          fi
          echo "Launch readiness gate passed."
