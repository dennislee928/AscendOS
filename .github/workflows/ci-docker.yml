name: ci-docker

on:
  pull_request:
    paths:
      - "infra/docker/**"
      - "services/**"
      - ".github/workflows/ci-docker.yml"
  push:
    branches:
      - main
    paths:
      - "infra/docker/**"
      - "services/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - core-gateway
          - chronos
          - metis
          - praxis
          - aegis
          - orator
          - neuro
          - argentum
          - kairos
          - agent-orchestrator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}/Dockerfile
          push: false
          tags: ascendos-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  hadolint:
    name: hadolint (Dockerfile lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint all Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3008,DL3018,DL3013
