name: ci-terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"

jobs:
  terraform-check:
    name: Fmt & Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.x"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive .

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate .

  terraform-plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: terraform-check
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_render_api_key: ${{ secrets.TF_VAR_render_api_key }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
      TF_VAR_supabase_access_token: ${{ secrets.TF_VAR_supabase_access_token }}
      TF_VAR_supabase_db_password: ${{ secrets.TF_VAR_supabase_db_password }}
      TF_VAR_upstash_api_key: ${{ secrets.TF_VAR_upstash_api_key }}
      TF_VAR_mongodbatlas_public_key: ${{ secrets.TF_VAR_mongodbatlas_public_key }}
      TF_VAR_mongodbatlas_private_key: ${{ secrets.TF_VAR_mongodbatlas_private_key }}
      TF_VAR_mongodbatlas_db_password: ${{ secrets.TF_VAR_mongodbatlas_db_password }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.x"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false 2>&1 | tee /tmp/tfplan.txt
        continue-on-error: true

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/tfplan.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n... output truncated ...'
              : plan;
            const exitCode = '${{ steps.plan.outcome }}' === 'failure' ? '1' : '0';
            const icon = exitCode === '0' ? '✅' : '❌';
            const body = `## Terraform Plan ${icon}

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            > Plan generated from commit \`${{ github.sha }}\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_render_api_key: ${{ secrets.TF_VAR_render_api_key }}
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
      TF_VAR_supabase_access_token: ${{ secrets.TF_VAR_supabase_access_token }}
      TF_VAR_supabase_db_password: ${{ secrets.TF_VAR_supabase_db_password }}
      TF_VAR_upstash_api_key: ${{ secrets.TF_VAR_upstash_api_key }}
      TF_VAR_mongodbatlas_public_key: ${{ secrets.TF_VAR_mongodbatlas_public_key }}
      TF_VAR_mongodbatlas_private_key: ${{ secrets.TF_VAR_mongodbatlas_private_key }}
      TF_VAR_mongodbatlas_db_password: ${{ secrets.TF_VAR_mongodbatlas_db_password }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.x"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
